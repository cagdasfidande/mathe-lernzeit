<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathe-Lernzeit</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#edf3f7;
  color:#26343c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}
.container{
  width:min(900px,94vw);
  background:#fff;
  border-radius:30px;
  padding:45px 50px 55px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
}
.fox{
  font-size:70px;
  line-height:1;
  margin-bottom:12px;
}
h1{
  margin:0 0 12px;
  font-size:clamp(42px,6vw,64px);
  font-weight:900;
}
.subtitle{
  font-size:23px;
  margin-bottom:35px;
  color:#65747c;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}
.button{
  text-decoration:none;
  color:#26343c;
  min-height:190px;
  border-radius:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
  transition:transform .12s;
}
.button:hover{transform:translateY(-2px)}
.button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,.12);
}
.math{background:#d9ebf7}
.kern{background:#d9f0df}
.rules{background:#f5dfad}
.icon{
  font-size:58px;
  margin-bottom:14px;
}
@media(max-width:700px){
  body{padding:15px}
  .container{padding:35px 20px 40px}
  .buttons{grid-template-columns:1fr}
  .button{min-height:155px}
}
</style>
</head>
<body>

<main class="container">

  <div class="fox">🦊</div>

  <h1>Mathe-Lernzeit</h1>

  <div class="subtitle">Was möchtest du üben?</div>

  <div class="buttons">

    <a class="button math" href="1x1einmalens.html">
      <div class="icon">✖️</div>
      1 × 1
    </a>

    <a class="button kern" href="kernaufgabe.html">
      <div class="icon">🧮</div>
      Kernaufgaben
    </a>

    <a class="button rules" href="Klassenregeln.html">
      <div class="icon">📋</div>
      Klassenregeln
    </a>

  </div>

</main>

</body>
</html>
