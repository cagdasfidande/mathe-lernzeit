<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einmaleins-Übung</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#f3f7fa,#e8eef3);
  color:#24343d;
}
.screen{display:none; min-height:100vh; align-items:center; justify-content:center; padding:28px}
.screen.active{display:flex}
.home{
  width:min(1000px,94vw);
  background:#fff; border-radius:28px; padding:38px;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
  text-align:center;
}
h1{font-size:clamp(34px,4vw,52px); margin:0 0 10px; font-weight:800}
.subtitle{font-size:22px;color:#66757d;margin-bottom:30px}
.tableGrid{
  display:grid; grid-template-columns:repeat(5,1fr);
  gap:16px; max-width:760px; margin:auto;
}
.tableBtn{
  border:0; border-radius:20px; padding:25px 10px;
  font-size:32px; font-weight:800; cursor:pointer;
  background:#dcecf7; color:#24343d;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
  transition:.12s;
}
.tableBtn:hover{transform:translateY(-2px)}
.tableBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.practice{
  width:min(1000px,94vw);
  display:flex; flex-direction:column; align-items:center; gap:18px;
}
.topbar{
  width:100%; background:#fff; border-radius:18px;
  padding:12px 18px; display:flex; align-items:center;
  justify-content:space-between; box-shadow:0 5px 18px rgba(0,0,0,.09);
}
.badge{
  background:#edf2f5; border-radius:11px;
  padding:8px 13px; font-weight:800; font-size:18px;
}
.practiceArea{
  display:flex; align-items:center; justify-content:center;
  gap:22px; width:100%;
}
.raceSide{
  width:min(150px,14vw);
  display:flex; align-items:center; justify-content:center;
}
.raceSideBtn{
  width:100%; min-height:130px;
  border:0; border-radius:24px;
  background:#f1d36a; color:#24343d;
  font-size:52px; font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.12);
  transition:.12s;
}
.raceSideBtn:hover{transform:translateY(-2px)}
.raceSideBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.raceSideLabel{
  display:block; font-size:16px; margin-top:7px;
  font-weight:800;
}
.card{
  width:min(760px,68vw); height:min(440px,62vh);
  background:#fff; border-radius:32px;
  box-shadow:0 14px 40px rgba(0,0,0,.14);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; cursor:pointer;
  user-select:none;
  transition:.15s;
}
.divisionCard{
  width:min(330px,28vw); height:min(300px,42vh);
  background:#fff; border-radius:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  padding:22px;
}
.divisionTitle{
  font-size:18px; font-weight:800; color:#66757d;
  margin-bottom:18px;
}
.divisionTasks{
  font-size:clamp(24px,3vw,36px);
  font-weight:900; line-height:1.65;
  text-align:center;
  opacity:0; transform:scale(.85);
  transition:.2s;
}
.divisionCard.revealed .divisionTasks{
  opacity:1; transform:scale(1);
}
.divisionHint{
  font-size:16px; color:#718089; margin-top:14px;
  text-align:center;
}
.card:hover{transform:scale(1.01)}
.task{font-size:clamp(55px,9vw,105px);font-weight:900;letter-spacing:2px}
.answer{
  font-size:clamp(50px,8vw,95px);font-weight:900;
  margin-top:18px; opacity:0; transform:scale(.7);
  transition:.2s;
}
.card.revealed .answer{opacity:1;transform:scale(1)}
.hint{font-size:20px;color:#718089;margin-top:15px}
.controls{display:flex;gap:10px}
.smallBtn{
  border:0;border-radius:12px;padding:11px 18px;
  font-size:17px;font-weight:700;background:#e8eef2;cursor:pointer;
}
.done{
  text-align:center;background:#fff;border-radius:26px;padding:35px 45px;
  box-shadow:0 12px 35px rgba(0,0,0,.13);
}
.done h2{font-size:38px;margin:0 0 12px}
.done p{font-size:21px;color:#66757d}

.raceBtn{
  border:0;border-radius:20px;padding:25px 10px;
  font-size:32px;font-weight:800;cursor:pointer;
  background:#f1d36a;color:#24343d;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
  transition:.12s;
  width:100%;max-width:760px;
  margin:18px auto 32px;
}
.raceBtn:hover{transform:translateY(-2px)}
.raceBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}

.testScreen{
  width:min(1000px,94vw);
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.testCard{
  width:min(760px,90vw);min-height:500px;
  background:#fff;border-radius:32px;
  box-shadow:0 14px 40px rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:35px;
}
.testTask{
  font-size:clamp(58px,9vw,105px);
  font-weight:900;letter-spacing:2px;
}
.testOptions{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:18px;width:min(700px,88vw);margin-top:38px;
}
.testOption{
  border:0;border-radius:18px;
  min-height:100px;padding:18px 10px;
  background:#e8eef2;
  font-size:clamp(32px,4vw,46px);
  font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.10);
}
.testOption:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.10)}
.testFeedback{font-size:21px;font-weight:800;min-height:28px;margin-top:18px}
.testDone{font-size:30px;font-weight:900;text-align:center;line-height:1.35}
.testDone small{display:block;font-size:22px;color:#66757d;margin-top:10px}

@media(max-width:700px){
 .tableGrid{grid-template-columns:repeat(3,1fr)}
 .tableBtn{font-size:25px;padding:20px 8px}
}

@media(max-width:900px){
  .practiceArea{gap:14px}
  .card{width:min(650px,65vw)}
  .divisionCard{width:min(280px,30vw)}
}
@media(max-width:700px){
  .practiceArea{flex-direction:column;gap:14px}
  .raceSide{width:min(760px,88vw)}
  .raceSideBtn{min-height:85px;font-size:42px}
  .raceSideLabel{display:inline;margin-left:8px}

  .card{width:min(760px,88vw);height:min(390px,55vh)}
  .divisionCard{width:min(760px,88vw);height:auto;min-height:180px}
  .divisionTitle{margin-bottom:8px}
  .divisionTasks{font-size:28px}
  .divisionHint{margin-top:6px}
}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="home">
    <a class="homeBack" href="index.html">🏠 Startseite</a>
    <h1>Einmaleins-Übung</h1>
    <div class="subtitle">Welche Reihe möchtest du üben?</div>
    <div class="tableGrid">
      <button class="tableBtn" onclick="startTable(1)">1</button>
      <button class="tableBtn" onclick="startTable(2)">2</button>
      <button class="tableBtn" onclick="startTable(3)">3</button>
      <button class="tableBtn" onclick="startTable(4)">4</button>
      <button class="tableBtn" onclick="startTable(5)">5</button>
      <button class="tableBtn" onclick="startTable(6)">6</button>
      <button class="tableBtn" onclick="startTable(7)">7</button>
      <button class="tableBtn" onclick="startTable(8)">8</button>
      <button class="tableBtn" onclick="startTable(9)">9</button>
      <button class="tableBtn" onclick="startTable(10)">10</button>
    </div>
  </div>
</section>

<section id="practiceScreen" class="screen">
  <div class="practice">
    <div class="topbar">
      <div class="badge" id="tableBadge"></div>
      <div class="badge" id="counter"></div>
    </div>

    <div class="practiceArea">
      <div class="raceSide">
        <button class="raceSideBtn" onclick="startTableRace()" title="Rennen starten">
          🏁
          <span class="raceSideLabel">Rennen</span>
        </button>
      </div>

      <div id="card" class="card" onclick="cardClick()">
        <div id="task" class="task"></div>
        <div id="answer" class="answer"></div>
        <div id="hint" class="hint">Karte anklicken</div>
      </div>

      <div id="divisionCard" class="divisionCard">
        <div class="divisionTitle">↔ Umkehraufgaben</div>
        <div id="divisionTasks" class="divisionTasks"></div>
        <div id="divisionHint" class="divisionHint">Erst die Karte anklicken</div>
      </div>
    </div>

    <div class="controls">
      <button class="smallBtn" onclick="backHome()">← Zurück</button>
      <button class="smallBtn" onclick="newOrder()">🔀 Neue Reihenfolge</button>
    </div>
  </div>
</section>


<section id="testScreen" class="screen">
  <div class="testScreen">
    <div class="topbar">
      <div class="badge">🏁</div>
      <div class="badge" id="testTableBadge">Reihe</div>
      <div class="badge" id="testTimer">00:00</div>
      <div class="badge" id="testCounter">1 / 10</div>
    </div>

    <div id="testCard" class="testCard">
      <div id="testTask" class="testTask"></div>
      <div id="testOptions" class="testOptions"></div>
      <div id="testFeedback" class="testFeedback"></div>
    </div>

    <div class="controls">
      <button class="smallBtn" onclick="backFromTest()">← Zurück</button>
    </div>
  </div>
</section>

<script>

let testQuestions=[];
let testPosition=0;
let testScore=0;
let testMistakes=0;
let testLocked=false;
let testStartTime=0;
let testTimerInterval=null;

function startTableRace(){
  testQuestions=[];
  for(let b=1;b<=10;b++){
    testQuestions.push({a:table,b:b,answer:table*b});
  }

  testQuestions=shuffle(testQuestions);
  testPosition=0;
  testScore=0;
  testMistakes=0;
  testLocked=false;
  testStartTime=Date.now();

  clearInterval(testTimerInterval);
  testTimerInterval=setInterval(updateTestTimer,1000);

  document.getElementById("home").classList.remove("active");
  document.getElementById("practiceScreen").classList.remove("active");
  document.getElementById("testScreen").classList.add("active");

  document.getElementById("testTableBadge").textContent=table+"er-Reihe";
  showTestQuestion();
}

function startTest(){
  startTableRace();
}

function formatTime(seconds){
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  return m+":"+s;
}

function updateTestTimer(){
  const seconds=Math.floor((Date.now()-testStartTime)/1000);
  document.getElementById("testTimer").textContent=formatTime(seconds);
}

function showTestQuestion(){
  testLocked=false;
  const q=testQuestions[testPosition];

  document.getElementById("testCounter").textContent=
    (testPosition+1)+" / "+testQuestions.length;
  document.getElementById("testTask").textContent=q.a+" × "+q.b;
  document.getElementById("testFeedback").textContent="";

  const options=new Set([q.answer]);
  while(options.size<3){
    let candidate=q.answer + Math.floor(Math.random()*13)-6;
    if(candidate>0 && candidate<=100 && candidate!==q.answer){
      options.add(candidate);
    }
  }

  const box=document.getElementById("testOptions");
  box.innerHTML="";

  shuffle([...options]).forEach(value=>{
    const btn=document.createElement("button");
    btn.className="testOption";
    btn.textContent=value;
    btn.onclick=()=>answerTest(value,btn);
    box.appendChild(btn);
  });
}

function answerTest(value,btn){
  if(testLocked)return;

  const q=testQuestions[testPosition];

  if(value===q.answer){
    testLocked=true;
    testScore++;
    btn.style.background="#bfe6c6";
    document.getElementById("testFeedback").textContent="✓ Richtig!";

    setTimeout(()=>{
      testPosition++;

      if(testPosition>=testQuestions.length){
        finishTest();
      }else{
        showTestQuestion();
      }
    },550);

  }else{
    testMistakes++;
    btn.style.background="#f1c1c1";
    document.getElementById("testFeedback").textContent=
      "Noch einmal überlegen …";

    setTimeout(()=>{
      btn.style.background="";
    },450);
  }
}

function finishTest(){
  clearInterval(testTimerInterval);

  const elapsed=Math.floor((Date.now()-testStartTime)/1000);
  const total=testQuestions.length;

  document.getElementById("testCounter").textContent=
    total+" / "+total;
  document.getElementById("testTimer").textContent=formatTime(elapsed);
  document.getElementById("testOptions").innerHTML="";

  document.getElementById("testTask").innerHTML=
    '<div class="testDone">'+
      '🏁 Geschafft!'+
      '<small>'+testScore+' von '+total+' richtig</small>'+
      '<small>'+testMistakes+' Fehler gemacht</small>'+
      '<small>Benötigte Zeit: '+formatTime(elapsed)+'</small>'+
    '</div>';

  document.getElementById("testFeedback").textContent="";
}

function backFromTest(){
  clearInterval(testTimerInterval);
  document.getElementById("testScreen").classList.remove("active");
  document.getElementById("home").classList.remove("active");
  document.getElementById("practiceScreen").classList.add("active");

  // Zurück führt zur gerade geübten Reihe.
  const card=document.getElementById("card");
  card.innerHTML=
    '<div id="task" class="task"></div>'+
    '<div id="answer" class="answer"></div>'+
    '<div id="hint" class="hint">Karte anklicken</div>';

  position=0;
  revealed=false;
  facts=shuffle([...Array(10)].map((_,i)=>i+1));
  showCard();
}

let table=2;
let facts=[];
let position=0;
let revealed=false;

function shuffle(array){
  return [...array].sort(()=>Math.random()-0.5);
}

function startTable(n){
  table=n;
  position=0;
  facts=shuffle([...Array(10)].map((_,i)=>i+1));
  document.getElementById("home").classList.remove("active");
  document.getElementById("practiceScreen").classList.add("active");
  showCard();
}

function showCard(){
  revealed=false;
  const factor=facts[position];
  const answer=table*factor;

  document.getElementById("tableBadge").textContent=table+"er-Reihe";
  document.getElementById("counter").textContent=(position+1)+" / 10";
  document.getElementById("task").textContent=table+" × "+factor;
  document.getElementById("answer").textContent=answer;
  document.getElementById("hint").textContent="Karte anklicken";
  document.getElementById("card").classList.remove("revealed");

  document.getElementById("divisionTasks").innerHTML =
    answer+" ÷ "+table+" = "+factor+"<br>"+
    answer+" ÷ "+factor+" = "+table;
  document.getElementById("divisionCard").classList.remove("revealed");
  document.getElementById("divisionHint").textContent="Erst die Karte anklicken";
}

function cardClick(){
  if(!revealed){
    revealed=true;
    document.getElementById("card").classList.add("revealed");
    document.getElementById("divisionCard").classList.add("revealed");
    document.getElementById("hint").textContent="Noch einmal klicken → nächste Aufgabe";
    document.getElementById("divisionHint").textContent="Umkehraufgaben";
  }else{
    position++;
    if(position>=facts.length){
      showDone();
    }else{
      showCard();
    }
  }
}

function showDone(){
  document.getElementById("card").innerHTML=
    '<div class="done">'+
      '<h2>🎉 Geschafft!</h2>'+
      '<p>Du hast die '+table+'er-Reihe geübt.</p>'+
    '</div>';
  document.getElementById("counter").textContent="10 / 10";
}

function newOrder(){
  facts=shuffle(facts);
  position=0;
  const card=document.getElementById("card");
  card.innerHTML=
    '<div id="task" class="task"></div><div id="answer" class="answer"></div><div id="hint" class="hint">Karte anklicken</div>';
  showCard();
}

function backHome(){
  document.getElementById("practiceScreen").classList.remove("active");
  document.getElementById("home").classList.add("active");
  const card=document.getElementById("card");
  card.innerHTML=
    '<div id="task" class="task"></div><div id="answer" class="answer"></div><div id="hint" class="hint">Karte anklicken</div>';
  document.getElementById("divisionCard").classList.remove("revealed");
}
</script>
</body>
</html>
