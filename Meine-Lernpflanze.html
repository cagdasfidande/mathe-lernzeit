<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Lernpflanze</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:#fbfbf8;color:#3f4548;
  display:flex;align-items:center;justify-content:center;
}
.page{
  width:min(1280px,96vw);background:white;border-radius:30px;
  padding:28px 34px 30px;box-shadow:0 8px 28px rgba(0,0,0,.08);
}
header{
  text-align:center;background:#eef3ea;border-radius:22px;
  padding:13px 20px;margin-bottom:12px;
}
h1{margin:0;font-size:40px;color:#35652d}
.subtitle{text-align:center;font-size:26px;font-weight:700;margin:8px 0 22px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.plant-card{
  border:3px solid #dce1d8;border-radius:22px;background:#fff;
  padding:4px 4px 13px;cursor:pointer;transition:.18s;
  text-align:center;overflow:hidden;
}
.plant-card:hover{
  transform:translateY(-5px);
  box-shadow:0 9px 20px rgba(0,0,0,.10);
}
.plant-card.selected{
  border-color:#6f9bc3;
  box-shadow:0 0 0 4px rgba(111,155,195,.16),0 10px 22px rgba(0,0,0,.12);
  transform:translateY(-5px);
}
.plant-card img{
  display:block;width:100%;height:275px;
  object-fit:contain;object-position:center bottom;
  background:white;border-radius:17px;
}
.name{font-size:24px;font-weight:700;margin-top:5px}
.desc{font-size:15px;color:#646b6e;margin-top:3px;min-height:19px}
.count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;height:38px;margin-top:8px;border-radius:19px;
  background:#f1f4f0;font-size:24px;font-weight:800;
}
.plant-card.selected .count{background:#e3f0df;color:#4d7c41}
.message{text-align:center;min-height:30px;margin:12px 0 8px;font-size:18px;font-weight:700}
.bottom{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  border:2px solid #e0e3df;border-radius:18px;padding:12px 16px;
}
.total{font-size:21px;font-weight:800;white-space:nowrap}
.note{font-size:17px;text-align:center;flex:1}
.reset{
  border:0;border-radius:12px;background:#f5dddd;color:#9a3e3e;
  padding:10px 17px;font-size:16px;font-weight:700;cursor:pointer;
}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<div class="message" id="message">Noch hat niemand gewählt.</div>

<div class="bottom">
  <div class="total">Schon gewählt: <span id="total">0</span> / 19</div>
  <div class="note">Jede Auswahl wird sofort mitgezählt. 🌱 Gemeinsam wachsen wir!</div>
  <button class="reset" onclick="resetAll()">↺ Zurücksetzen</button>

<script>
let counts=[0,0,0], total=0;

function vote(i){
  if(total>=19){
    document.getElementById("message").textContent="Alle 19 Kinder haben schon gewählt. 🌱";
    return;
  }
  counts[i]++;
  total++;
  update();
  document.querySelectorAll(".plant-card").forEach((c,n)=>c.classList.toggle("selected",n===i));
  document.getElementById("message").textContent="Danke! Jetzt ist das nächste Kind dran.";
  setTimeout(()=>document.querySelectorAll(".plant-card").forEach(c=>c.classList.remove("selected")),700);
}

function update(){
  document.getElementById("total").textContent=total;
  counts.forEach((n,i)=>document.getElementById("count"+i).textContent=n);
}

function resetAll(){
  if(confirm("Alle Ergebnisse wirklich löschen?")){
    counts=[0,0,0];
    total=0;
    update();
    document.getElementById("message").textContent="Noch hat niemand gewählt.";
    document.querySelectorAll(".plant-card").forEach(c=>c.classList.remove("selected"));
  }
}
</script>
